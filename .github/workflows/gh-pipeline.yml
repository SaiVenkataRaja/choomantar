# with approval gates 
name: DevSecOps Pipeline for Choomantar 

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: '1.0'

jobs: 
  # STAGE 1: Code Security Scan
  fs_security_scan:
    runs-on: ubuntu-latest
    environment: security-scan-approval
    steps:
      - name: Download Code from Repository
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan (Check for Secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # STAGE 2: Build, Image Scan, & Push
  build_scan_and_push:
    needs: fs_security_scan
    runs-on: ubuntu-latest
    environment: build-approval
    steps:
      - name: Download Code from Repository
        uses: actions/checkout@v4

      - name: Build Unified Docker Image
        run: docker build -t svr77/choomantar:${{ github.event.inputs.image_tag }} .

      - name: Run Trivy Image Scan (Check Base OS)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'svr77/choomantar:${{ github.event.inputs.image_tag }}'
          scan-type: 'image'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Secure Image to Registry
        run: docker push svr77/choomantar:${{ github.event.inputs.image_tag }}

  # STAGE 3: Production Deployment
  deploy_to_vm:
    needs: build_scan_and_push
    runs-on: ubuntu-latest
    environment: production-deployment-approval
    steps:
      - name: Deploy to Azure Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_KEY }}
          script: |
            # 1. Install Docker if it isn't already installed on the VM
            if ! command -v docker &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi
            
            # 2. Stop and remove any existing container using this name
            echo "Cleaning up existing containers..."
            sudo docker stop choomantar || true
            sudo docker rm choomantar || true
            
            # 3. Target external port (8082)
            echo "Clearing port 8082 if occupied..."
            sudo fuser -k -n tcp 8082 || true
            sleep 1
            
            # 4. Pull fresh verified image
            sudo docker pull svr77/choomantar:${{ github.event.inputs.image_tag }}
            
            # 5. Run new container
            echo "Deploying new container..."
            sudo docker run -d --name choomantar --restart always -p 8082:3000 svr77/choomantar:${{ github.event.inputs.image_tag }}